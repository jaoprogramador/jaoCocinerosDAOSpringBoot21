spring.application.name=cocineros-api
server.port=8090

# Expone todos los endpoints
management.endpoints.web.exposure.include=*

# Habilita explícitamente los endpoints individuales
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.info.enabled=true

# Habilita el mapeo de las propiedades info.*
management.info.env.enabled=true

# Información personalizada
info.app.name=jaoRestaurante
info.app.version=1.0.0
info.app.description=Aplicación que demuestra el uso de DevTools y Actuator
# Configuración de la base de datos postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/cocineros_bd
spring.datasource.username=postgres
spring.datasource.password=mi_clave_secreta
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# migracion datos flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true